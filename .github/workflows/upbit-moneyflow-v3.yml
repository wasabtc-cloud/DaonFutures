name: Upbit MoneyFlow V3

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/upbit_moneyflow_v3.py'
      - '.github/workflows/upbit-moneyflow-v3.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy matplotlib requests
      - name: Run v3 backtest
        run: python backtest/upbit_moneyflow_v3.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: upbit-moneyflow-v3
          path: upbit_moneyflow_v3_results.csv

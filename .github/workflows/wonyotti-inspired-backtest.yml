name: Wonyotti Inspired Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest/wonyotti_inspired_backtest.py'
      - '.github/workflows/wonyotti-inspired-backtest.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run research backtest
        run: cd backtest && python wonyotti_inspired_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonyotti-inspired-backtest
          retention-days: 14
          if-no-files-found: warn
          path: |
            backtest/wonyotti_inspired_trades.csv
            backtest/wonyotti_inspired_summary.csv
            backtest/wonyotti_inspired_monthly.csv

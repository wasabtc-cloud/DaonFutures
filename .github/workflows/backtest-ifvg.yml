name: Backtest manipulation iFVG
on:
  push:
    paths:
      - 'tools/backtest_manipulation_ifvg.py'
      - '.github/workflows/backtest-ifvg.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run 3-year BTCUSDT futures backtest
        run: python tools/backtest_manipulation_ifvg.py --start 2023-09 --end 2026-08
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ifvg-backtest-results
          path: backtest_results/

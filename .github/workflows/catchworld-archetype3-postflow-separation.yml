name: CatchWorld Archetype3 Postflow Separation
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: catchworld-strategy-b-scout-*
          path: strategy_b_input
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35128138456
          repository: wasabtc-cloud/DaonFutures
      - name: Compare true pumps with false 4x3 signals
        run: python backtest/catchworld_archetype3_postflow_separation.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-archetype3-postflow-separation
          path: results/archetype3_postflow_separation/
          retention-days: 90

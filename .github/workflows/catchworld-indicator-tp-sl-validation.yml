name: Catch World Indicator TP SL Validation
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to validate
        required: true
        default: '365'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run indicator and TP SL validation
        env:
          DAYS: ${{ inputs.days }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: python backtest/catchworld_indicator_tp_sl_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-indicator-${{ inputs.days }}d-${{ matrix.shard }}
          path: indicator_tp_sl_shard_${{ matrix.shard }}.csv
          retention-days: 90

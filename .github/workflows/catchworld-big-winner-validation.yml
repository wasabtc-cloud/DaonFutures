name: CatchWorld Big Winner Validation
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Download trade-strength artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/trade_strength /tmp/cw
          for id in 10454397115 10454985004 10456599844 10456142911 10454642726 10455205805 10456216548 10455279463; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id/zip > /tmp/cw/$id.zip
            unzip -o /tmp/cw/$id.zip -d data/trade_strength
          done
      - name: Run big-winner validation
        run: python backtest/catchworld_big_winner_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-big-winner-validation
          path: results/big_winner/
          retention-days: 90

name: CatchWorld Next Stage Research
on:
  workflow_dispatch:
jobs:
  next-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: catchworld-strategy-b-scout-*
          path: strategy_b_input
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35128138456
          repository: wasabtc-cloud/DaonFutures
      - name: FIRST RELOAD and causal holdout study
        run: python backtest/catchworld_next_stage_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-next-stage-research
          path: results/next_stage/
          retention-days: 90

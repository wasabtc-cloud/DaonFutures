name: Daily Surge Accumulation Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/upbit_daily_surge_accumulation.py'
      - '.github/workflows/daily-surge-accumulation.yml'

jobs:
  research:
    name: research-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run shard ${{ matrix.shard }}
        run: python backtest/upbit_daily_surge_accumulation.py
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catchworld-surge-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: results_daily_surge/shard_${{ matrix.shard }}/

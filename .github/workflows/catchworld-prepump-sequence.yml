name: CatchWorld Pre-Pump Sequence Study
on:
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: catchworld-strategy-b-scout-*
          path: strategy_b_input
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35128138456
          repository: wasabtc-cloud/DaonFutures
      - name: Run causal pre-pump sequence study
        run: python backtest/catchworld_prepump_sequence_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-prepump-sequence-study
          path: results/prepump_sequence/
          retention-days: 90

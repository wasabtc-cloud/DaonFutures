name: Catch World Locked Long Validation
on:
  workflow_dispatch:
    inputs:
      days:
        description: Validation days (365 or 1095)
        required: false
        default: '365'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run locked validation
        env:
          DAYS: ${{ inputs.days }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '4'
        run: python backtest/catchworld_locked_long_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-locked-${{ inputs.days }}d-${{ matrix.shard }}
          path: locked_long_shard_${{ matrix.shard }}.csv

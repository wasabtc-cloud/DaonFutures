name: Upbit 9AM Top5 Profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest/upbit_9am_scanner.py'
      - 'backtest/upbit_9am_top5_enrich.py'
      - 'backtest/upbit_9am_followup_analysis.py'
      - '.github/workflows/upbit-9am-top5-profile.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run scanner
        run: python backtest/upbit_9am_scanner.py
      - name: Enrich top5
        run: python backtest/upbit_9am_top5_enrich.py
      - name: Run follow-up analysis
        run: python backtest/upbit_9am_followup_analysis.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upbit-9am-top5-profile
          retention-days: 14
          if-no-files-found: warn
          path: results_9am/

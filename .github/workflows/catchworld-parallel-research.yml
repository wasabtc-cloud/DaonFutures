name: CatchWorld Parallel Research
on:
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: catchworld-strategy-b-scout-*
          path: strategy_b_input
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35128138456
          repository: wasabtc-cloud/DaonFutures
      - name: SELL lifecycle reverse study
        run: python backtest/catchworld_sell_reverse_study.py
      - name: False-positive diagnostics
        run: python backtest/catchworld_false_positive_classifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-parallel-research
          path: |
            results/sell_reverse/
            results/false_positive_diagnostics/
          retention-days: 90

name: CatchWorld Strategy B Scout
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'History days'
        required: true
        default: '365'
jobs:
  scout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Build Strategy B scout dataset
        env:
          DAYS: ${{ inputs.days }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'
        run: python backtest/catchworld_strategy_b_scout.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-strategy-b-scout-${{ matrix.shard }}
          path: |
            strategy_b_scout_shard_${{ matrix.shard }}.csv
            strategy_b_events_shard_${{ matrix.shard }}.csv
          retention-days: 90

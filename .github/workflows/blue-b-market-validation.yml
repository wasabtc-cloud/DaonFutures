name: BLUE B Market Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/blue_b_market_validation.py'
      - '.github/workflows/blue-b-market-validation.yml'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: python backtest/blue_b_market_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: blue-b-market-validation-${{ matrix.shard }}
          path: results_blue_b_market/
          retention-days: 14

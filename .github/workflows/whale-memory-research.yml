name: Whale Memory Historical Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/whale_memory_research.py'
      - '.github/workflows/whale-memory-research.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run whale-memory historical research
        run: python backtest/whale_memory_research.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-memory-research
          retention-days: 14
          if-no-files-found: warn
          path: |
            results_whale_memory/whale_memory_samples.csv
            results_whale_memory/whale_memory_feature_lifts.csv

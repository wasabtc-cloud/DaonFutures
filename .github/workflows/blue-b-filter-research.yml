name: BLUE B Filter Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest/blue_b_filter_research.py'
      - '.github/workflows/blue-b-filter-research.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Build focused lifecycle data
        run: python backtest/capital_lifecycle_focus.py
      - name: Test BLUE B filters
        run: python backtest/blue_b_filter_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: blue-b-filter-research
          path: results_blue_b_filter/

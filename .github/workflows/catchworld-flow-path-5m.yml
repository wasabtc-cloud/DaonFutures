name: Catch World 5m Flow Path Dataset
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to collect
        required: true
        default: '365'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Collect entry-centered 5m flow paths
        env:
          DAYS: ${{ inputs.days }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: python backtest/catchworld_flow_path_5m.py
      - uses: actions/upload-artifact@v4
        with:
          name: catchworld-flow-path-${{ inputs.days }}d-${{ matrix.shard }}
          path: flow_path_5m_shard_${{ matrix.shard }}.csv
          retention-days: 90
